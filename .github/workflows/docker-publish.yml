name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ] # Hoặc "master" tùy thuộc vào nhánh code chính của bạn

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build và đẩy Frontend (Thư mục client trong dự án của bạn)
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: quih789/mern-frontend:latest

      # Build và đẩy Backend (Thư mục server trong dự án của bạn dựa theo danh sách file bên trái)
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: quih789/mern-backend:latest
